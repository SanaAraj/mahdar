services:
  proxy:
    image: caddy:2-alpine
    ports:
      - "8100:8100"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

  api:
    build: ./apps/api
    env_file: .env
    environment:
      # Keep the Hugging Face model cache on the volume so it survives restarts.
      HF_HOME: /data/hf
    volumes:
      - mahdar-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped

  # Offline fallback: a local Ollama server under the "local" profile. Start it
  # with `docker compose --profile local up`; STT_PROVIDER=local and
  # LLM_PROVIDER=local in .env point the app at it. The command serves, pulls
  # the configured model once if absent, then waits on the server. Compose
  # interpolates ${LOCAL_LLM_MODEL} from .env at parse time, so the service
  # pulls exactly the model the app requests; a $$ escape here would defer to
  # the in-container shell, where the variable is never set.
  ollama:
    image: ollama/ollama:0.32.15
    profiles: ["local"]
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ollama serve & sleep 3 && (ollama show "${LOCAL_LLM_MODEL:-qwen3:8b}" >/dev/null 2>&1 || ollama pull "${LOCAL_LLM_MODEL:-qwen3:8b}") && wait

volumes:
  # Named volume: initializes from the image, so the non-root container user
  # always owns /data. A bind mount of ./data would create a root-owned
  # directory on a fresh Linux clone and break job writes.
  mahdar-data:
  # Ollama model weights, so the ~5 GB pull survives restarts and rebuilds.
  ollama-data:
